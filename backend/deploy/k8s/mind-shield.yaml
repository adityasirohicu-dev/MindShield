apiVersion: v1
kind: Namespace
metadata:
  name: mind-shield
---
apiVersion: v1
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mind-shield
spec:
  ports:
    - port: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: mind-shield
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: mindshield
            - name: POSTGRES_USER
              value: mindshield
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mind-shield-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: mind-shield
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
  selector:
    app: mind-shield-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mind-shield-api
  namespace: mind-shield
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mind-shield-api
  template:
    metadata:
      labels:
        app: mind-shield-api
    spec:
      containers:
        - name: api
          image: mind-shield-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mind-shield-secrets
                  key: SECRET_KEY
            - name: DATABASE_URL
              value: postgresql+psycopg2://mindshield:$(POSTGRES_PASSWORD)@postgres:5432/mindshield
            - name: APP_ENV
              value: pilot
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-replica
  namespace: mind-shield
spec:
  ports:
    - port: 5432
  selector:
    app: postgres
  # Pilot: point dashboard read queries at a replica Service once streaming replication is enabled.
