services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mindshield
      POSTGRES_PASSWORD: mindshield
      POSTGRES_DB: mindshield
    ports:
      - "5432:5432"
    volumes:
      - mindshield_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindshield"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://mindshield:mindshield@db:5432/mindshield
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["jobs"]

volumes:
  mindshield_pg:
